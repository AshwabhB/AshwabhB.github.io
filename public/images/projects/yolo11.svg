<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1410"/><stop offset="1" stop-color="#120d09"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#c97153" stop-opacity="0.5"/><stop offset="1" stop-color="#db8f72"/></linearGradient>
    <linearGradient id="bar2" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#dcae55" stop-opacity="0.5"/><stop offset="1" stop-color="#dcae55"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <text x="80" y="110" fill="#a89a8b" font-size="22" letter-spacing="6" font-weight="600">YOLO11 ENHANCEMENTS   |   GTSDB VALIDATION</text>
  <text x="80" y="165" fill="#f0e6da" font-size="40" font-weight="700">From-scratch detector: mAP@0.5 across development stages</text>

  <!-- chart area: x 120..1000, baseline y=760, top y=260 (0..1.0) -->
  <g stroke="#2d2420" stroke-width="2">
    <line x1="120" y1="760" x2="1000" y2="760"/>
    <line x1="120" y1="260" x2="120" y2="760"/>
  </g>
  <g fill="#a89a8b" font-size="18" font-family="JetBrains Mono, monospace" text-anchor="end">
    <text x="105" y="766">0.0</text><text x="105" y="641">0.25</text><text x="105" y="516">0.50</text><text x="105" y="391">0.75</text><text x="105" y="266">1.0</text>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.06"><line x1="120" y1="635" x2="1000" y2="635"/><line x1="120" y1="510" x2="1000" y2="510"/><line x1="120" y1="385" x2="1000" y2="385"/><line x1="120" y1="260" x2="1000" y2="260"/></g>

  <!-- bars: height = value*500 -->
  <g>
    <rect x="160" y="514" width="80" height="246" rx="8" fill="url(#bar)"/><text x="200" y="500" text-anchor="middle" fill="#f0e6da" font-size="20" font-weight="700">0.492</text><text x="200" y="792" text-anchor="middle" fill="#a89a8b" font-size="17">YOLOv8n</text><text x="200" y="814" text-anchor="middle" fill="#a89a8b" font-size="17">baseline</text>
    <rect x="280" y="482" width="80" height="278" rx="8" fill="url(#bar)"/><text x="320" y="468" text-anchor="middle" fill="#f0e6da" font-size="20" font-weight="700">0.556</text><text x="320" y="792" text-anchor="middle" fill="#a89a8b" font-size="17">+ close</text><text x="320" y="814" text-anchor="middle" fill="#a89a8b" font-size="17">mosaic</text>
    <rect x="400" y="425" width="80" height="335" rx="8" fill="url(#bar)"/><text x="440" y="411" text-anchor="middle" fill="#f0e6da" font-size="20" font-weight="700">0.670</text><text x="440" y="792" text-anchor="middle" fill="#a89a8b" font-size="17">+ one-cycle</text><text x="440" y="814" text-anchor="middle" fill="#a89a8b" font-size="17">cosine LR</text>
    <rect x="520" y="387" width="80" height="373" rx="8" fill="url(#bar)"/><text x="560" y="373" text-anchor="middle" fill="#f0e6da" font-size="20" font-weight="700">0.746</text><text x="560" y="792" text-anchor="middle" fill="#a89a8b" font-size="17">YOLO11n</text><text x="560" y="814" text-anchor="middle" fill="#a89a8b" font-size="17">backbone</text>
    <rect x="640" y="378" width="80" height="382" rx="8" fill="url(#bar2)"/><text x="680" y="364" text-anchor="middle" fill="#f0e6da" font-size="20" font-weight="700">0.764</text><text x="680" y="792" text-anchor="middle" fill="#dcae55" font-size="17" font-weight="600">+ C2DSA</text><text x="680" y="814" text-anchor="middle" fill="#a89a8b" font-size="17">attention</text>
    <rect x="760" y="374" width="80" height="386" rx="8" fill="url(#bar2)"/><text x="800" y="360" text-anchor="middle" fill="#f0e6da" font-size="20" font-weight="700">0.771</text><text x="800" y="792" text-anchor="middle" fill="#dcae55" font-size="17" font-weight="600">+ SAAL</text><text x="800" y="814" text-anchor="middle" fill="#a89a8b" font-size="17">assignment</text>
    <rect x="880" y="364" width="80" height="396" rx="8" fill="url(#bar2)"/><text x="920" y="350" text-anchor="middle" fill="#f0e6da" font-size="20" font-weight="700">0.792</text><text x="920" y="792" text-anchor="middle" fill="#dcae55" font-size="17" font-weight="600">+ TTA</text><text x="920" y="814" text-anchor="middle" fill="#a89a8b" font-size="17">inference</text>
  </g>

  <g transform="translate(1080,260)">
    <rect width="440" height="140" rx="18" fill="#1f1915" stroke="#2d2420" stroke-width="2"/>
    <text x="28" y="44" fill="#a89a8b" font-size="17" letter-spacing="3" font-weight="600">C2DSA</text>
    <text x="28" y="80" fill="#f0e6da" font-size="30" font-weight="700">+1.8% mAP@0.5</text>
    <text x="28" y="112" fill="#a89a8b" font-size="18">dual-stream spatial + channel attention</text>
  </g>
  <g transform="translate(1080,420)">
    <rect width="440" height="140" rx="18" fill="#1f1915" stroke="#2d2420" stroke-width="2"/>
    <text x="28" y="44" fill="#a89a8b" font-size="17" letter-spacing="3" font-weight="600">SAAL</text>
    <text x="28" y="80" fill="#f0e6da" font-size="30" font-weight="700">0.974 precision</text>
    <text x="28" y="112" fill="#a89a8b" font-size="18">size-adaptive anchor assignment, Phase 2</text>
  </g>
  <g transform="translate(1080,580)">
    <rect width="440" height="140" rx="18" fill="#1f1915" stroke="#db8f72" stroke-width="2"/>
    <text x="28" y="44" fill="#a89a8b" font-size="17" letter-spacing="3" font-weight="600">CONTRASTIVE OOD HEAD</text>
    <text x="28" y="80" fill="#db8f72" font-size="30" font-weight="700">0.997 AUROC</text>
    <text x="28" y="112" fill="#a89a8b" font-size="18">unseen-class detection, ~98K params</text>
  </g>
  <g transform="translate(1080,740)">
    <rect width="440" height="140" rx="18" fill="#1f1915" stroke="#2d2420" stroke-width="2"/>
    <text x="28" y="44" fill="#a89a8b" font-size="17" letter-spacing="3" font-weight="600">PRETRAINED YOLO11n + ALL FOUR</text>
    <text x="28" y="80" fill="#f0e6da" font-size="30" font-weight="700">0.956 to 0.979 mAP@0.5</text>
    <text x="28" y="112" fill="#a89a8b" font-size="18">no framework fork, YAML module injection</text>
  </g>
  <text x="80" y="930" fill="#a89a8b" font-size="20">Overall: 0.492 to 0.792 mAP@0.5 on the from-scratch model, a 61% relative improvement over 15 documented stages.</text>
</svg>
